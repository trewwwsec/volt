name: Live Smoke (Non-Blocking)

on:
  workflow_dispatch:
  schedule:
    - cron: "15 8 * * 1"

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Sync dependencies (dev)
        run: uv sync --group dev

      - name: Run bounded live smoke matrix
        run: |
          mkdir -p /tmp/subrecon-live-smoke
          uv run python - <<'PY'
          import json
          import shlex
          import subprocess
          from pathlib import Path

          output_dir = Path("/tmp/subrecon-live-smoke")
          cases = [
              {
                  "name": "core_e2e_iana",
                  "timeout": 420,
                  "cmd": (
                      "uv run subrecon -d iana.org --no-subfinder --no-amass "
                      "-o /tmp/subrecon-live-smoke/core_e2e_iana.json"
                  ),
              },
              {
                  "name": "s3_noaa_goes19",
                  "timeout": 240,
                  "cmd": (
                      "uv run subrecon -d noaa-goes19.test --keywords noaa-goes19 "
                      "--no-ct --no-subfinder --no-amass --no-search --no-gcp --no-azure "
                      "--no-takeover -o /tmp/subrecon-live-smoke/s3_noaa_goes19.json"
                  ),
              },
              {
                  "name": "gcs_landsat",
                  "timeout": 240,
                  "cmd": (
                      "uv run subrecon -d gcp-public-data.test --keywords gcp-public-data-landsat "
                      "--no-ct --no-subfinder --no-amass --no-search --no-s3 --no-azure "
                      "--no-takeover -o /tmp/subrecon-live-smoke/gcs_landsat.json"
                  ),
              },
              {
                  "name": "amass_only_iana_t30",
                  "timeout": 300,
                  "cmd": (
                      "uv run subrecon -d iana.org --tool-timeout 30 --no-ct --no-subfinder "
                      "--no-search --no-s3 --no-gcp --no-azure --no-takeover "
                      "-o /tmp/subrecon-live-smoke/amass_only_iana_t30.json"
                  ),
              },
          ]

          summary: dict[str, dict[str, object]] = {}
          for case in cases:
              name = str(case["name"])
              timeout = int(case["timeout"])
              cmd = str(case["cmd"])
              print(f"[live-smoke] running {name}: {cmd}")
              try:
                  proc = subprocess.run(
                      shlex.split(cmd),
                      capture_output=True,
                      text=True,
                      timeout=timeout,
                      check=False,
                  )
                  summary[name] = {
                      "status": "completed",
                      "returncode": proc.returncode,
                      "timeout_seconds": timeout,
                      "stdout_tail": proc.stdout[-4000:],
                      "stderr_tail": proc.stderr[-4000:],
                  }
              except subprocess.TimeoutExpired as exc:
                  summary[name] = {
                      "status": "timeout",
                      "returncode": 124,
                      "timeout_seconds": timeout,
                      "stdout_tail": (exc.stdout or "")[-4000:],
                      "stderr_tail": (exc.stderr or "")[-4000:],
                  }

          (output_dir / "summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True),
              encoding="utf-8",
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Summarize source_health statuses
        if: always()
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          output_dir = Path("/tmp/subrecon-live-smoke")
          report_paths = sorted(output_dir.glob("*.json"))
          print("[live-smoke] report summaries:")
          for report_path in report_paths:
              if report_path.name == "summary.json":
                  continue
              try:
                  data = json.loads(report_path.read_text(encoding="utf-8"))
              except Exception as exc:
                  print(f"- {report_path.name}: unreadable ({exc})")
                  continue
              source_health = data.get("source_health", {})
              status_parts: list[str] = []
              for source_name in sorted(source_health):
                  source_status = source_health[source_name].get("status", "unknown")
                  status_parts.append(f"{source_name}={source_status}")
              total_findings = data.get("summary", {}).get("total_findings", "n/a")
              joined = ", ".join(status_parts) if status_parts else "no source_health"
              print(f"- {report_path.name}: findings={total_findings}; {joined}")
          PY

      - name: Upload live smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-smoke-${{ github.run_id }}
          path: /tmp/subrecon-live-smoke
          if-no-files-found: warn
