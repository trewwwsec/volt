[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "volt"
dynamic = ["version"]
description = "Lightweight ASM CLI for passive perimeter intelligence."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []

[project.scripts]
volt = "volt:main"

[dependency-groups]
dev = ["ruff>=0.11,<1.0"]

[tool.uv]
package = true

[tool.setuptools]
py-modules = [
    "volt",
    "volt_version",
    "cli",
    "constants",
    "core",
    "models",
    "networking",
    "parsing",
    "reporting",
    "volt_models",
    "volt_reporting",
]
include-package-data = false

[tool.setuptools.dynamic]
version = { attr = "volt_version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["sources*"]

[tool.ruff]
target-version = "py310"
