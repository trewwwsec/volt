name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Lint (Ruff)
        run: uvx ruff check .

      - name: Format check (Ruff)
        run: uvx ruff format --check .

      - name: Static compile check
        run: >
          uv run python -m compileall -q
          subrecon.py cli.py constants.py core.py models.py networking.py parsing.py
          reporting.py subrecon_models.py subrecon_reporting.py sources tests

      - name: Run unit tests
        run: uv run python -m unittest discover -s tests -p "test_*.py"
