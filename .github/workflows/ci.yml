name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Sync dependencies (dev)
        run: uv sync --group dev

      - name: Lint (Ruff)
        run: uv run ruff check .

      - name: Format check (Ruff)
        run: uv run ruff format --check .

      - name: Static compile check
        run: uv run python scripts/check_compile.py

      - name: Run unit tests
        run: uv run python -m unittest discover -s tests -p "test_*.py"

      - name: Build and install wheel in clean environment
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/volt-wheel"
          uv venv --python "$(command -v python)" "$RUNNER_TEMP/volt-installed"
          uv pip install --python "$RUNNER_TEMP/volt-installed/bin/python" --no-deps "$RUNNER_TEMP"/volt-wheel/*.whl

      - name: Smoke test installed CLI offline
        run: >
          "$RUNNER_TEMP/volt-installed/bin/python" scripts/validation_smoke.py
          --executable "$RUNNER_TEMP/volt-installed/bin/volt"
          --output-dir "$RUNNER_TEMP/volt-validation"

      - name: Upload offline validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-validation-${{ github.run_id }}
          path: ${{ runner.temp }}/volt-validation
          if-no-files-found: warn
