[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "subrecon"
version = "0.1.0"
description = "Passive perimeter intelligence scanner for domains and organizations."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []

[project.scripts]
subrecon = "subrecon:main"

[dependency-groups]
dev = ["ruff>=0.11,<1.0"]

[tool.uv]
package = true

[tool.setuptools]
py-modules = [
    "subrecon",
    "cli",
    "constants",
    "core",
    "models",
    "networking",
    "parsing",
    "reporting",
    "subrecon_models",
    "subrecon_reporting",
]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["sources*"]

[tool.ruff]
target-version = "py310"
